name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    env:
      SIGN_P12_BASE64: ${{ secrets.SIGN_P12_BASE64 }}
      SIGN_P12_PASSWORD: ${{ secrets.SIGN_P12_PASSWORD }}
    # Intel runner by default: Apple Silicon runners are often queued for a
    # long time on public repositories. scripts/build.sh cross-builds arm64.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          uname -m

      # The stable signing certificate (see scripts/build.sh) goes into a
      # throwaway keychain that lives only for this job.
      - name: Signing keychain
        if: env.SIGN_P12_BASE64 != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(openssl rand -hex 24)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$SIGN_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$SIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" > /dev/null
          rm -f "$RUNNER_TEMP/signing.p12"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN_PASSWORD=$KCPW" >> "$GITHUB_ENV"

      - name: Build (arm64)
        env:
          # A release must never go out ad-hoc signed.
          REQUIRE_STABLE_SIGNATURE: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: ./scripts/build.sh

      - name: Package
        run: |
          ditto -c -k --keepParent build/MacSoundLab.app MacSoundLab.zip
          shasum -a 256 MacSoundLab.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MacSoundLab
          path: MacSoundLab.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MacSoundLab.zip
          body: |
            Mac Sound Lab (arm64, macOS 14.2+)

            Скачай `MacSoundLab.zip`, распакуй, положи приложение в «Программы»,
            открой правым кликом → «Открыть» и выдай разрешение
            «Запись системного звука». Модель StemgenRT (int8, 3 МБ) встроена
            в приложение, скачивать ничего не нужно.
